<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Recipes</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=63)}" href="/css/style.css?v=63" />
  </head>
  <body class="recipes-page page-recipes">
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="page-content page-content--recipes">
      <section class="recipes-shell">
        <header class="recipes-hero">
          <div>
            <h1>Find your next favorite meals</h1>
            <p class="recipes-subtitle">
              Explore curated recipes, save the ones you love, and build a plan that fits your week.
            </p>
            <div class="recipes-search">
              <input type="text" placeholder="Search recipes or ingredients" aria-label="Search recipes or ingredients" />
              <button type="button">Search</button>
            </div>
          </div>
          <div class="recipes-hero-card recipes-hero-card--image">
            <img src="/img/recipess.jpg" alt="Featured recipes" />
          </div>
        </header>

        <div class="recipes-layout">
          <aside class="recipes-filters" aria-label="Recipe filters">
            <div class="filters-group">
              <h3>Meal type</h3>
              <button type="button">Breakfast</button>
              <button type="button">Lunch</button>
              <button type="button">Dinner</button>
              <button type="button">Dessert</button>
            </div>
            <div class="filters-group">
              <h3>Region</h3>
              <button type="button">American</button>
              <button type="button">Asian</button>
              <button type="button">European</button>
              <button type="button">Mexican</button>
            </div>
            <div class="filters-group">
              <h3>By</h3>
              <button type="button">Teen Kitchen</button>
              <button type="button">Young &amp; Hungry</button>
              <button type="button">Home Cooks</button>
              <button type="button">Grandma's Classics</button>
            </div>
            <div class="filters-group">
              <h3>Time</h3>
              <button type="button">&lt; 15 min</button>
              <button type="button">15 min · 30 min</button>
              <button type="button">30 min · 1 h</button>
              <button type="button">1 h · 2 h</button>
              <button type="button">&gt; 2 h</button>
            </div>
            <div class="filters-group">
              <h3>Style</h3>
              <button type="button">No cook</button>
              <button type="button">One pot</button>
              <button type="button">Budget</button>
            </div>
            <div class="filters-group">
              <h3>Nutrition</h3>
              <button type="button">Vegetarian</button>
              <button type="button">Gluten-free</button>
              <button type="button">Protein+</button>
              <button type="button">Fiber+</button>
            </div>
          </aside>

          <div class="recipes-grid">
            <article class="recipes-card" th:each="recipe : ${recipes}"
                     th:attr="data-href=@{/recipes/{id}(id=${recipe.id})}"
                     th:onclick="|window.location.href='@{/recipes/{id}(id=${recipe.id})}'|"
                     th:onkeydown="|if(event.key==='Enter'){window.location.href='@{/recipes/{id}(id=${recipe.id})}';}|"
                     role="link" tabindex="0" aria-label="Open recipe">
              <button class="recipes-favorite" type="button" aria-label="Favorite recipe"
                      th:attr="data-recipe-id=${recipe.id}, aria-pressed=${favoriteRecipeIds != null && favoriteRecipeIds.contains(recipe.id) ? 'true' : 'false'}"
                      onclick="event.stopPropagation()"
                      th:if="${currentUserId == null || recipe.ownerId != currentUserId}"
                      th:classappend="${favoriteRecipeIds != null && favoriteRecipeIds.contains(recipe.id) ? ' is-active' : ''}">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M9.999 17.27l-1.45-1.32C4.4 12.36 2 10.28 2 7.5 2 5.5 3.5 4 5.5 4c1.54 0 3.04.99 3.57 2.36h1.87C11.46 4.99 12.96 4 14.5 4 16.5 4 18 5.5 18 7.5c0 2.78-2.4 4.86-6.55 8.45l-1.45 1.32z"/>
                </svg>
              </button>
              <div class="recipes-owner" th:if="${currentUserId != null && recipe.ownerId == currentUserId}">
                Your Recipe
              </div>
              <a class="recipes-media" th:href="@{/recipes/{id}(id=${recipe.id})}"
                 th:classappend="${recipe.imagePath != null ? '' : ' recipes-media--citrus'}"
                 th:style="${recipe.imagePath != null ? 'background-image: linear-gradient(120deg, rgba(41, 30, 24, 0.25), rgba(18, 14, 11, 0.45)), url(' + recipe.imagePath + ')' : ''}"
                 aria-label="View recipe"></a>
              <div class="recipes-body">
                <div>
                  <h3><a th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.title}">Recipe title</a></h3>
                  <p class="recipes-note" th:text="${recipe.mealType + ' · ' + recipe.prepTime}">Meal · 0 min</p>
                  <p class="recipes-desc" th:text="${recipe.shortDescription}">Short description.</p>
                </div>
                <div class="recipes-tags">
                  <span th:each="tag : ${recipe.tags}" th:text="${tag}">tag</span>
                </div>
                <div class="recipes-actions">
                  <button class="recipes-action" type="button" onclick="event.stopPropagation()">+ groceries</button>
                </div>
              </div>
            </article>
            <p class="recipes-empty" th:if="${#lists.isEmpty(recipes)}">No recipes yet. Add your first one!</p>
          </div>
        </div>
      </section>
    </main>
    <div th:replace="~{fragments :: auth-modals}"></div>
    <div th:replace="~{fragments :: footer}"></div>
    <script>
      (() => {
        const favorites = document.querySelectorAll(".recipes-favorite");
        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");
        const cards = document.querySelectorAll(".recipes-card");
        favorites.forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            const recipeId = btn.getAttribute("data-recipe-id");
            if (!recipeId) {
              btn.classList.toggle("is-active");
              btn.setAttribute("aria-pressed", btn.classList.contains("is-active") ? "true" : "false");
              return;
            }

            fetch(`/recipes/${recipeId}/favorite`, {
              method: "POST",
              headers: csrfToken && csrfHeader ? { [csrfHeader]: csrfToken } : {},
            })
              .then((res) => {
                if (res.status === 401) {
                  window.location.href = "/#auth-login";
                  return null;
                }
                return res.json();
              })
              .then((data) => {
                if (!data || !data.ok) {
                  return;
                }
                btn.classList.toggle("is-active", !!data.favorited);
                btn.setAttribute("aria-pressed", data.favorited ? "true" : "false");
              });
          });
        });

        cards.forEach((card) => {
          card.classList.add("recipes-card--link");
        });

        const filterButtons = document.querySelectorAll(".filters-group button");
        filterButtons.forEach((btn) => {
          btn.setAttribute("aria-pressed", "false");
          btn.addEventListener("click", () => {
            const isActive = btn.classList.toggle("is-active");
            btn.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        });
      })();
    </script>
  </body>
</html>
