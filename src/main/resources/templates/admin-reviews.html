<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Reviews</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=67)}" href="/css/style.css?v=67" />
  </head>
  <body class="page-admin-reviews">
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="page-content admin-page">
      <section class="admin-hero">
        <p class="admin-kicker">Administration</p>
        <div class="admin-hero__top">
          <h1>Reviews Management</h1>
          <div class="admin-total" aria-label="Total reviews">
            <span class="admin-total__label">Total</span>
            <strong class="admin-total__value" th:text="${sectionTotal}">0</strong>
          </div>
        </div>
        <p class="admin-subtitle">Track ratings and comments before adding moderation actions.</p>
        <form class="admin-search" method="get" th:action="@{/admin/reviews}">
          <input
            type="search"
            name="q"
            placeholder="Search reviews by author, recipe, or comment"
            th:value="${searchQuery}"
            aria-label="Search reviews"
          />
          <button class="btn-secondary" type="submit">Search</button>
        </form>
      </section>

      <div class="admin-feedback admin-feedback--success" th:if="${adminMessage}" th:text="${adminMessage}">Action completed.</div>
      <div class="admin-feedback admin-feedback--error" th:if="${adminError}" th:text="${adminError}">Action failed.</div>

      <section class="admin-grid">
        <article class="admin-panel admin-panel--reviews">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Recipe</th>
                  <th>Author</th>
                  <th>Comment</th>
                  <th>Rating</th>
                  <th>Created</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(reviewRows)}">
                  <td colspan="7">No reviews yet.</td>
                </tr>
                <tr th:each="review : ${reviewRows}">
                  <td th:text="${review.commentId}">1</td>
                  <td th:text="${review.recipeTitle}">Recipe title</td>
                  <td th:text="${review.authorName}">Author Name</td>
                  <td th:text="${review.commentText}">Text</td>
                  <td th:text="${review.ratingValue != null ? review.ratingValue : '-'}">-</td>
                  <td th:text="${review.createdAt != null ? #temporals.format(review.createdAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yy') : '-'}">-</td>
                  <td>
                    <form th:action="@{/admin/reviews/{id}/delete(id=${review.commentId})}" method="post" class="admin-inline-form" onsubmit="return confirm('Delete this review?');">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <input type="hidden" name="q" th:value="${searchQuery}" />
                      <input type="hidden" name="page" th:value="${currentPage}" />
                      <button type="submit" class="admin-action-btn admin-action-btn--danger">Delete</button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      </section>

      <nav class="recipes-pagination" th:if="${totalPages > 1}" aria-label="Reviews pagination">
        <a class="recipes-page-btn"
           th:classappend="${currentPage == 1 ? ' is-disabled' : ''}"
           th:attr="aria-disabled=${currentPage == 1}"
           th:href="@{/admin/reviews(q=${searchQuery}, page=${currentPage - 1})}">
          Previous
        </a>
        <span class="recipes-page-indicator" th:text="${'Page ' + currentPage + ' of ' + totalPages}">Page 1 of 1</span>
        <a class="recipes-page-btn"
           th:classappend="${currentPage == totalPages ? ' is-disabled' : ''}"
           th:attr="aria-disabled=${currentPage == totalPages}"
           th:href="@{/admin/reviews(q=${searchQuery}, page=${currentPage + 1})}">
          Next
        </a>
      </nav>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
