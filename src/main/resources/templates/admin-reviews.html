<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Avis</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=67)}" href="/css/style.css?v=67" />
  </head>
  <body class="page-admin-reviews">
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="page-content admin-page">
      <section class="admin-hero">
        <p class="admin-kicker">Administration</p>
        <div class="admin-hero__top">
          <h1>Gestion des avis</h1>
          <div class="admin-total" aria-label="Total reviews">
            <span class="admin-total__label">Total</span>
            <strong class="admin-total__value" th:text="${sectionTotal}">0</strong>
          </div>
        </div>
        <p class="admin-subtitle">Suivez les notes et commentaires avant de moderer.</p>
        <form class="admin-search" method="get" th:action="@{/admin/reviews}">
          <input
            type="search"
            name="q"
            placeholder="Rechercher par auteur, recette ou commentaire"
            th:value="${searchQuery}"
            aria-label="Rechercher des avis"
          />
          <button class="btn-secondary" type="submit">Rechercher</button>
        </form>
      </section>

      <div class="admin-feedback admin-feedback--success" th:if="${adminMessage}" th:text="${adminMessage}">Action terminee.</div>
      <div class="admin-feedback admin-feedback--error" th:if="${adminError}" th:text="${adminError}">Echec de l'action.</div>

      <section class="admin-grid">
        <article class="admin-panel admin-panel--reviews">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Recette</th>
                  <th>Auteur</th>
                  <th>Commentaire</th>
                  <th>Note</th>
                  <th>Créé le</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(reviewRows)}">
                  <td colspan="7">Aucun avis pour le moment.</td>
                </tr>
                <tr th:each="review : ${reviewRows}">
                  <td th:text="${review.commentId}">1</td>
                  <td th:text="${review.recipeTitle}">Recipe title</td>
                  <td th:text="${review.authorName}">Author Name</td>
                  <td th:text="${review.commentText}">Text</td>
                  <td th:text="${review.ratingValue != null ? review.ratingValue : '-'}">-</td>
                  <td th:text="${review.createdAt != null ? #temporals.format(review.createdAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yy') : '-'}">-</td>
                  <td>
                    <form th:action="@{/admin/reviews/{id}/delete(id=${review.commentId})}" method="post" class="admin-inline-form" onsubmit="return confirm('Supprimer cet avis ?');">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <input type="hidden" name="q" th:value="${searchQuery}" />
                      <input type="hidden" name="page" th:value="${currentPage}" />
                      <button type="submit" class="admin-action-btn admin-action-btn--danger">Supprimer</button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      </section>

      <nav class="recipes-pagination" th:if="${totalPages > 1}" aria-label="Pagination des avis">
        <a class="recipes-page-btn"
           th:classappend="${currentPage == 1 ? ' is-disabled' : ''}"
           th:attr="aria-disabled=${currentPage == 1}"
           th:href="@{/admin/reviews(q=${searchQuery}, page=${currentPage - 1})}">
          Précédent
        </a>
        <span class="recipes-page-indicator" th:text="${'Page ' + currentPage + ' sur ' + totalPages}">Page 1 sur 1</span>
        <a class="recipes-page-btn"
           th:classappend="${currentPage == totalPages ? ' is-disabled' : ''}"
           th:attr="aria-disabled=${currentPage == totalPages}"
           th:href="@{/admin/reviews(q=${searchQuery}, page=${currentPage + 1})}">
          Suivant
        </a>
      </nav>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
