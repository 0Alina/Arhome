<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=81)}" href="/css/style.css?v=81" />
  </head>
  <body class="page-groceries">
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="page-content">
      <section class="groceries-page-shell">
        <div class="groceries-shell recipes-shell">
          <p class="groceries-top-note">Tous les ingrédients dont vous avez besoin, prêts pour votre prochaine visite au magasin.</p>
          <div class="groceries-layout">
            <section class="groceries-weekly" aria-label="Courses du plan hebdomadaire">
              <p class="weekly-plan-empty" data-weekly-plan-empty hidden>Aucun plan hebdomadaire actif pour le moment.</p>
              <div class="weekly-plan-list" data-weekly-plan-list></div>
            </section>

            <div class="groceries-right-column">
              <form class="groceries-card groceries-form-card" action="#" method="post" onsubmit="return false;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="add-recipe-field add-recipe-field--fill">
                  <div class="groceries-card-head">
                    <h2>Produits alimentaires</h2>
                  </div>

                  <div class="add-recipe-ingredients groceries-ingredients" data-groceries-rows>
                    <div class="add-recipe-ingredient-row groceries-ingredient-row" data-groceries-row>
                      <input type="text" name="ingredientItems[0].name" placeholder="Produit" required />
                      <input type="number" name="ingredientItems[0].quantity" min="0" step="0.5" placeholder="Quantité" required />

                      <div class="ingredient-unit-select groceries-unit-select" data-unit-select>
                        <input type="hidden" name="ingredientItems[0].unit" value="" data-unit-value />
                        <button type="button" class="ingredient-unit-trigger" data-unit-trigger aria-expanded="false">Unité</button>
                        <div class="ingredient-unit-menu" data-unit-menu>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="pcs">pcs</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="pinch">pinch</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="tsp">tsp</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="tbsp">tbsp</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="cup">cup</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="ml">ml</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="l">l</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="g">g</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="kg">kg</button>
                        </div>
                      </div>

                      <button type="button" class="btn-primary groceries-inline-add" data-groceries-inline-add>Ajouter</button>
                    </div>
                  </div>

                  <div class="groceries-added-wrap" data-groceries-added-wrap>
                    <ul class="groceries-added-list" data-groceries-added-list></ul>
                    <section class="bought-section groceries-added-bought" data-groceries-added-bought hidden>
                      <h4>Déjà acheté</h4>
                      <ul class="groceries-added-list groceries-added-bought-list" data-groceries-added-bought-list></ul>
                    </section>
                  </div>
                </div>
              </form>

              <section class="groceries-products" aria-label="Produits alimentaires">
                <article class="groceries-recipe-box">
                  <div class="groceries-recipe-empty" data-groceries-recipe-empty hidden>
                    <p class="groceries-recipe-source">de la recette</p>
                    <h3 class="groceries-recipe-title">Aucune recette sélectionnée</h3>
                  </div>
                  <div class="groceries-recipe-groups" data-groceries-recipe-groups></div>
                </article>
              </section>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments :: auth-modals}"></div>
    <div th:replace="~{fragments :: footer}"></div>

    <script th:inline="javascript">
      (() => {
        const initialManualItems = /*[[${initialManualItems}]]*/ [];
        const initialRecipeBoxes = /*[[${initialRecipeBoxes}]]*/ [];
        const initialPlanBoxes = /*[[${initialPlanBoxes}]]*/ [];

        const rowsContainer = document.querySelector("[data-groceries-rows]");
        if (!(rowsContainer instanceof HTMLElement)) return;

        const form = rowsContainer.closest("form");
        const csrfTokenInput = form ? form.querySelector("input[type='hidden'][name]") : null;
        const csrfToken = csrfTokenInput instanceof HTMLInputElement ? csrfTokenInput.value : null;

        const inlineAddButton = rowsContainer.querySelector("[data-groceries-inline-add]");
        const productInput = rowsContainer.querySelector("input[name='ingredientItems[0].name']");
        const qtyInput = rowsContainer.querySelector("input[name='ingredientItems[0].quantity']");
        const unitValueInput = rowsContainer.querySelector("[data-unit-value]");
        const addedList = document.querySelector("[data-groceries-added-list]");
        const addedBoughtSection = document.querySelector("[data-groceries-added-bought]");
        const addedBoughtList = document.querySelector("[data-groceries-added-bought-list]");
        const recipeEmpty = document.querySelector("[data-groceries-recipe-empty]");
        const recipeGroups = document.querySelector("[data-groceries-recipe-groups]");
        const weeklyPlanEmpty = document.querySelector("[data-weekly-plan-empty]");
        const weeklyPlanList = document.querySelector("[data-weekly-plan-list]");

        if (!(inlineAddButton instanceof HTMLButtonElement)
          || !(productInput instanceof HTMLInputElement)
          || !(qtyInput instanceof HTMLInputElement)
          || !(unitValueInput instanceof HTMLInputElement)
          || !(addedList instanceof HTMLUListElement)
          || !(addedBoughtSection instanceof HTMLElement)
          || !(addedBoughtList instanceof HTMLUListElement)
          || !(recipeEmpty instanceof HTMLElement)
          || !(recipeGroups instanceof HTMLElement)
          || !(weeklyPlanEmpty instanceof HTMLElement)
          || !(weeklyPlanList instanceof HTMLElement)) {
          return;
        }

        const apiHeaders = () => {
          const headers = { "Content-Type": "application/json" };
          if (csrfToken) headers["X-CSRF-TOKEN"] = csrfToken;
          return headers;
        };

        const MANUAL_ITEM_AUTO_DELETE_MS = 3000;
        const MANUAL_ITEM_FADE_MS = 450;
        const pendingManualAutoDelete = new WeakMap();
        const RECIPE_GROUP_AUTO_REMOVE_MS = 3000;
        const RECIPE_GROUP_FADE_MS = 450;
        const pendingRecipeGroupAutoDelete = new WeakMap();
        const PLAN_BOX_AUTO_REMOVE_MS = 3000;
        const PLAN_BOX_FADE_MS = 450;
        const pendingPlanBoxAutoDelete = new WeakMap();

        const clearManualAutoDelete = (row, options = {}) => {
          const { clearFadeClass = true } = options;
          const timerState = pendingManualAutoDelete.get(row);
          if (timerState) {
            clearTimeout(timerState.fadeTimerId);
            clearTimeout(timerState.deleteTimerId);
            pendingManualAutoDelete.delete(row);
          }
          if (clearFadeClass) {
            row.classList.remove("is-auto-removing");
          }
          addedBoughtSection.classList.remove("is-clearing");
        };

        const scheduleManualAutoDelete = (row) => {
          clearManualAutoDelete(row);

          const fadeDelay = Math.max(0, MANUAL_ITEM_AUTO_DELETE_MS - MANUAL_ITEM_FADE_MS);
          const fadeTimerId = setTimeout(() => {
            row.classList.add("is-auto-removing");
            const isLastBoughtItem = row.parentElement === addedBoughtList && addedBoughtList.children.length === 1;
            if (isLastBoughtItem) {
              addedBoughtSection.classList.add("is-clearing");
            }
          }, fadeDelay);

          const deleteTimerId = setTimeout(() => {
            pendingManualAutoDelete.delete(row);
            autoDeleteAfterFade(row);
          }, MANUAL_ITEM_AUTO_DELETE_MS);

          pendingManualAutoDelete.set(row, { fadeTimerId, deleteTimerId });
        };

        const closeUnitMenus = (exceptRoot = null) => {
          document.querySelectorAll("[data-unit-select]").forEach((selectRoot) => {
            if (!(selectRoot instanceof HTMLElement)) return;
            if (exceptRoot && selectRoot === exceptRoot) return;
            selectRoot.classList.remove("is-open");
            const trigger = selectRoot.querySelector("[data-unit-trigger]");
            if (trigger instanceof HTMLButtonElement) {
              trigger.setAttribute("aria-expanded", "false");
            }
          });
        };

        const bindUnitSelect = (rowElement) => {
          const selectRoot = rowElement.querySelector("[data-unit-select]");
          const trigger = rowElement.querySelector("[data-unit-trigger]");
          const valueInput = rowElement.querySelector("[data-unit-value]");
          const optionButtons = rowElement.querySelectorAll("[data-unit-option]");

          if (!(selectRoot instanceof HTMLElement) || !(trigger instanceof HTMLButtonElement) || !(valueInput instanceof HTMLInputElement)) {
            return;
          }

          const syncState = () => {
            const value = valueInput.value ? valueInput.value.trim() : "";
            trigger.textContent = value || "Unité";
            trigger.classList.toggle("is-empty", value.length === 0);

            optionButtons.forEach((optionButton) => {
              if (!(optionButton instanceof HTMLButtonElement)) return;
              optionButton.classList.toggle("is-selected", optionButton.dataset.value === value);
            });
          };

          trigger.addEventListener("click", () => {
            const willOpen = !selectRoot.classList.contains("is-open");
            closeUnitMenus(selectRoot);
            selectRoot.classList.toggle("is-open", willOpen);
            trigger.setAttribute("aria-expanded", willOpen ? "true" : "false");
          });

          optionButtons.forEach((optionButton) => {
            optionButton.addEventListener("click", () => {
              valueInput.value = optionButton.dataset.value || "";
              syncState();
              closeUnitMenus();
            });
          });

          syncState();
        };

        const setupBoughtSection = (boxElement, sourceSelector) => {
          const sourceList = boxElement.querySelector(sourceSelector);
          if (!(sourceList instanceof HTMLUListElement)) return;

          const boughtSection = document.createElement("section");
          boughtSection.className = "bought-section";
          boughtSection.hidden = true;

          const title = document.createElement("h4");
          title.textContent = "Déjà acheté";

          const boughtList = document.createElement("ul");
          boughtList.className = `${sourceList.className} bought-checklist`;

          boughtSection.appendChild(title);
          boughtSection.appendChild(boughtList);
          boxElement.appendChild(boughtSection);

          const refreshState = () => {
            boughtSection.hidden = boughtList.children.length === 0;
          };

          boxElement.addEventListener("change", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement) || target.type !== "checkbox") return;

            const row = target.closest("li");
            if (!(row instanceof HTMLLIElement)) return;
            const inBoughtList = row.parentElement === boughtList;

            if (target.checked && !inBoughtList) {
              boughtList.appendChild(row);
              row.classList.add("is-bought");
            }

            if (!target.checked && inBoughtList) {
              sourceList.appendChild(row);
              row.classList.remove("is-bought");
            }

            refreshState();
          });

          refreshState();
        };

        const refreshAddedBoughtVisibility = () => {
          addedBoughtSection.hidden = addedBoughtList.children.length === 0;
        };

        const refreshRecipeGroupBoughtVisibility = (groupElement) => {
          if (!(groupElement instanceof HTMLElement)) return;
          const boughtSection = groupElement.querySelector("[data-recipe-group-bought]");
          const boughtList = groupElement.querySelector("[data-recipe-group-bought-list]");
          if (!(boughtSection instanceof HTMLElement) || !(boughtList instanceof HTMLUListElement)) return;
          boughtSection.hidden = boughtList.children.length === 0;
        };

        const refreshPlanBoxBoughtVisibility = (boxElement) => {
          if (!(boxElement instanceof HTMLElement)) return;
          const boughtSection = boxElement.querySelector(".bought-section");
          const boughtList = boxElement.querySelector(".bought-checklist");
          if (!(boughtSection instanceof HTMLElement) || !(boughtList instanceof HTMLUListElement)) return;
          boughtSection.hidden = boughtList.children.length === 0;
        };

        const removePlanBoxIfComplete = async (boxElement) => {
          if (!(boxElement instanceof HTMLElement)) return;
          const activeList = boxElement.querySelector(".weekly-plan-checklist");
          const boughtList = boxElement.querySelector(".bought-checklist");
          if (!(activeList instanceof HTMLUListElement) || !(boughtList instanceof HTMLUListElement)) return;
          if (activeList.children.length > 0 || boughtList.children.length === 0) return;

          const ids = Array.from(boughtList.querySelectorAll("li[data-id]"))
            .map((row) => row.getAttribute("data-id"))
            .filter(Boolean);
          schedulePlanBoxAutoDelete(boxElement, ids);
        };

        const clearPlanBoxAutoDelete = (boxElement) => {
          const timerState = pendingPlanBoxAutoDelete.get(boxElement);
          if (timerState) {
            clearTimeout(timerState.fadeTimerId);
            clearTimeout(timerState.deleteTimerId);
            pendingPlanBoxAutoDelete.delete(boxElement);
          }
          boxElement.classList.remove("is-clearing");
        };

        const autoRemovePlanBox = async (boxElement, ids) => {
          const previousParent = boxElement.parentElement;
          const previousNextSibling = boxElement.nextSibling;

          boxElement.remove();
          weeklyPlanEmpty.hidden = !!weeklyPlanList.querySelector(".weekly-plan-box");

          if (!ids || ids.length === 0) return;
          const results = await Promise.allSettled(
            ids.map((itemId) => fetch(`/groceries/items/${itemId}`, {
              method: "DELETE",
              headers: apiHeaders(),
            }))
          );

          const hasFailure = results.some((result) => result.status === "rejected" || (result.value && !result.value.ok));
          if (hasFailure && previousParent instanceof Node) {
            previousParent.insertBefore(boxElement, previousNextSibling);
            boxElement.classList.remove("is-clearing");
            weeklyPlanEmpty.hidden = true;
          }
        };

        const schedulePlanBoxAutoDelete = (boxElement, ids) => {
          clearPlanBoxAutoDelete(boxElement);

          const fadeDelay = Math.max(0, PLAN_BOX_AUTO_REMOVE_MS - PLAN_BOX_FADE_MS);
          const fadeTimerId = setTimeout(() => {
            boxElement.classList.add("is-clearing");
          }, fadeDelay);

          const deleteTimerId = setTimeout(() => {
            pendingPlanBoxAutoDelete.delete(boxElement);
            autoRemovePlanBox(boxElement, ids);
          }, PLAN_BOX_AUTO_REMOVE_MS);

          pendingPlanBoxAutoDelete.set(boxElement, { fadeTimerId, deleteTimerId });
        };

        const clearRecipeGroupAutoDelete = (groupElement, options = {}) => {
          const { hideReadyMessage = true, clearFadeClass = true } = options;
          const timerState = pendingRecipeGroupAutoDelete.get(groupElement);
          if (timerState) {
            clearTimeout(timerState.fadeTimerId);
            clearTimeout(timerState.deleteTimerId);
            pendingRecipeGroupAutoDelete.delete(groupElement);
          }

          if (clearFadeClass) {
            groupElement.classList.remove("is-clearing");
          }

          const readyNote = groupElement.querySelector("[data-recipe-ready-note]");
          if (hideReadyMessage && readyNote instanceof HTMLElement) {
            readyNote.hidden = true;
          }
        };

        const autoRemoveRecipeGroup = async (groupElement) => {
          const recipeId = groupElement.dataset.recipeId;
          if (!recipeId) {
            clearRecipeGroupAutoDelete(groupElement);
            return;
          }

          const previousParent = groupElement.parentElement;
          const previousNextSibling = groupElement.nextSibling;

          groupElement.remove();
          if (!recipeGroups.querySelector(".groceries-recipe-group")) {
            recipeEmpty.hidden = false;
          }

          try {
            const response = await fetch(`/groceries/items/from-recipe/${recipeId}`, {
              method: "DELETE",
              headers: apiHeaders(),
            });
            if (response.ok) {
              return;
            }
          } catch (_error) {
          }

          if (previousParent instanceof Node) {
            previousParent.insertBefore(groupElement, previousNextSibling);
          } else {
            recipeGroups.appendChild(groupElement);
          }
          recipeEmpty.hidden = true;
          clearRecipeGroupAutoDelete(groupElement, { hideReadyMessage: false, clearFadeClass: true });
        };

        const scheduleRecipeGroupAutoDelete = (groupElement) => {
          clearRecipeGroupAutoDelete(groupElement, { hideReadyMessage: false, clearFadeClass: true });

          const readyNote = groupElement.querySelector("[data-recipe-ready-note]");
          if (readyNote instanceof HTMLElement) {
            readyNote.hidden = false;
          }

          const fadeDelay = Math.max(0, RECIPE_GROUP_AUTO_REMOVE_MS - RECIPE_GROUP_FADE_MS);
          const fadeTimerId = setTimeout(() => {
            groupElement.classList.add("is-clearing");
          }, fadeDelay);

          const deleteTimerId = setTimeout(() => {
            pendingRecipeGroupAutoDelete.delete(groupElement);
            autoRemoveRecipeGroup(groupElement);
          }, RECIPE_GROUP_AUTO_REMOVE_MS);

          pendingRecipeGroupAutoDelete.set(groupElement, { fadeTimerId, deleteTimerId });
        };

        const createAddedItem = (item) => {
          const row = document.createElement("li");
          row.className = "groceries-added-item";
          row.dataset.id = String(item.id);

          const label = document.createElement("label");
          label.className = "groceries-added-main";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !!item.bought;
          const name = document.createElement("span");
          name.className = "groceries-added-name";
          name.textContent = item.productName;
          label.appendChild(checkbox);
          label.appendChild(name);

          const meta = document.createElement("span");
          meta.className = "groceries-added-meta";
          meta.textContent = `${item.quantity} ${item.unit}`;

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "groceries-added-delete";
          removeBtn.setAttribute("aria-label", `Delete ${item.productName}`);
          removeBtn.textContent = "x";

          row.appendChild(label);
          row.appendChild(meta);
          row.appendChild(removeBtn);

          if (item.bought) {
            row.classList.add("is-bought");
          }

          return row;
        };

        const renderUserItems = (items) => {
          addedList.innerHTML = "";
          addedBoughtList.innerHTML = "";

          items.forEach((item) => {
            const row = createAddedItem(item);
            if (item.bought) {
              addedBoughtList.appendChild(row);
            } else {
              addedList.appendChild(row);
            }
          });

          refreshAddedBoughtVisibility();
        };

        const createRecipeItem = (item) => {
          const row = document.createElement("li");
          row.dataset.id = String(item.id);

          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !!item.bought;

          const name = document.createElement("span");
          name.textContent = item.productName;

          label.appendChild(checkbox);
          label.appendChild(name);

          const meta = document.createElement("strong");
          meta.textContent = `${item.quantity} ${item.unit}`;

          row.appendChild(label);
          row.appendChild(meta);
          if (item.bought) {
            row.classList.add("is-bought");
          }
          return row;
        };

        const createPlanItem = (item) => {
          const row = document.createElement("li");
          row.dataset.id = String(item.id);

          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !!item.bought;

          const name = document.createElement("span");
          name.textContent = item.productName;

          label.appendChild(checkbox);
          label.appendChild(name);

          const meta = document.createElement("strong");
          meta.textContent = `${item.quantity} ${item.unit}`;

          row.appendChild(label);
          row.appendChild(meta);
          if (item.bought) {
            row.classList.add("is-bought");
          }
          return row;
        };

        const createRecipeGroup = (box) => {
          const group = document.createElement("section");
          group.className = "groceries-recipe-group";
          group.dataset.recipeId = String(box.recipeId || "");

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "groceries-recipe-remove";
          removeBtn.setAttribute("aria-label", `Remove ${box.recipeTitle || "recipe"}`);
          removeBtn.setAttribute("data-recipe-remove", "");
          removeBtn.textContent = "x";

          const source = document.createElement("p");
          source.className = "groceries-recipe-source";
          source.textContent = "de la recette";

          const title = document.createElement("h3");
          title.className = "groceries-recipe-title";
          title.textContent = box.recipeTitle || "Recipe";

          const readyNote = document.createElement("p");
          readyNote.className = "groceries-recipe-ready-note";
          readyNote.textContent = "Everything ready for this recipe.";
          readyNote.setAttribute("data-recipe-ready-note", "");
          readyNote.hidden = true;

          const activeList = document.createElement("ul");
          activeList.className = "groceries-recipe-ingredients";
          activeList.setAttribute("data-recipe-group-list", "");

          const boughtSection = document.createElement("section");
          boughtSection.className = "bought-section";
          boughtSection.setAttribute("data-recipe-group-bought", "");
          boughtSection.hidden = true;

          const boughtTitle = document.createElement("h4");
          boughtTitle.textContent = "Déjà acheté";

          const boughtList = document.createElement("ul");
          boughtList.className = "groceries-recipe-ingredients bought-checklist";
          boughtList.setAttribute("data-recipe-group-bought-list", "");

          boughtSection.appendChild(boughtTitle);
          boughtSection.appendChild(boughtList);

          group.appendChild(source);
          group.appendChild(title);
          group.appendChild(readyNote);
          group.appendChild(removeBtn);
          group.appendChild(activeList);
          group.appendChild(boughtSection);

          const items = Array.isArray(box.items) ? box.items : [];
          items.forEach((item) => {
            const row = createRecipeItem(item);
            if (item.bought) {
              boughtList.appendChild(row);
            } else {
              activeList.appendChild(row);
            }
          });

          refreshRecipeGroupBoughtVisibility(group);
          return group;
        };

        const renderRecipeItems = (boxes) => {
          recipeGroups.innerHTML = "";
          const sourceBoxes = Array.isArray(boxes) ? boxes : [];

          if (sourceBoxes.length === 0) {
            recipeEmpty.hidden = false;
            return;
          }

          recipeEmpty.hidden = true;
          sourceBoxes.forEach((box) => {
            recipeGroups.appendChild(createRecipeGroup(box));
          });
        };

        const createPlanBox = (box) => {
          const group = document.createElement("article");
          group.className = "weekly-plan-box";
          group.dataset.planId = String(box.planId || "");
          group.dataset.planDay = String(box.day || "");

          const head = document.createElement("div");
          head.className = "weekly-plan-box-head";

          const title = document.createElement("p");
          title.textContent = box.planTitle || "Weekly plan";

          const day = document.createElement("span");
          day.textContent = box.day || "Day";

          head.appendChild(title);
          head.appendChild(day);

          const activeList = document.createElement("ul");
          activeList.className = "weekly-plan-checklist";

          const boughtSection = document.createElement("section");
          boughtSection.className = "bought-section";
          boughtSection.hidden = true;

          const boughtTitle = document.createElement("h4");
          boughtTitle.textContent = "Déjà acheté";

          const boughtList = document.createElement("ul");
          boughtList.className = "weekly-plan-checklist bought-checklist";

          boughtSection.appendChild(boughtTitle);
          boughtSection.appendChild(boughtList);

          group.appendChild(head);
          group.appendChild(activeList);
          group.appendChild(boughtSection);

          const items = Array.isArray(box.items) ? box.items : [];
          items.forEach((item) => {
            const row = createPlanItem(item);
            if (item.bought) {
              boughtList.appendChild(row);
            } else {
              activeList.appendChild(row);
            }
          });

          refreshPlanBoxBoughtVisibility(group);
          return group;
        };

        const renderPlanBoxes = (boxes) => {
          weeklyPlanList.innerHTML = "";
          const sourceBoxes = Array.isArray(boxes) ? boxes : [];
          weeklyPlanEmpty.hidden = sourceBoxes.length > 0;
          sourceBoxes.forEach((box) => {
            weeklyPlanList.appendChild(createPlanBox(box));
          });
        };

        rowsContainer.querySelectorAll("[data-groceries-row]").forEach((row) => {
          if (!(row instanceof HTMLElement)) return;
          bindUnitSelect(row);
        });

        rowsContainer.addEventListener("pointerdown", (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const targetQtyInput = target.closest("input[type='number']");
          if (!(targetQtyInput instanceof HTMLInputElement)) return;

          const rect = targetQtyInput.getBoundingClientRect();
          const clickX = event.clientX - rect.left;
          const clickY = event.clientY - rect.top;
          const arrowZone = clickX >= rect.width - 22;
          if (!arrowZone) return;

          event.preventDefault();
          const min = targetQtyInput.min !== "" ? Number(targetQtyInput.min) : Number.NEGATIVE_INFINITY;
          const parsedStep = Number(targetQtyInput.step);
          const step = Number.isFinite(parsedStep) && parsedStep > 0 ? parsedStep : 1;
          const current = targetQtyInput.value !== "" ? Number(targetQtyInput.value) : 0;

          let next = current;
          if (clickY < rect.height / 2) {
            next = current + step;
          } else {
            next = current - step;
          }

          if (next < min) next = min;
          targetQtyInput.value = String(Number(next.toFixed(4)));
          targetQtyInput.dispatchEvent(new Event("input", { bubbles: true }));
          targetQtyInput.dispatchEvent(new Event("change", { bubbles: true }));
        });

        document.querySelectorAll(".weekly-plan-box").forEach((box) => {
          if (!(box instanceof HTMLElement)) return;
          setupBoughtSection(box, ".weekly-plan-checklist");
        });

        inlineAddButton.addEventListener("click", async () => {
          const productName = productInput.value.trim();
          const quantity = qtyInput.value.trim();
          const unit = (unitValueInput.value || "").trim() || "unité";
          if (!productName || !quantity) return;

          try {
            const response = await fetch("/groceries/items", {
              method: "POST",
              headers: apiHeaders(),
              body: JSON.stringify({ productName, quantity, unit }),
            });
            if (!response.ok) return;
            const item = await response.json();
            const row = createAddedItem(item);
            addedList.appendChild(row);

            productInput.value = "";
            qtyInput.value = "";
            productInput.focus();
          } catch (_error) {
          }
        });

        const handleDelete = async (row, options = {}) => {
          const { preserveFadeClass = false } = options;
          clearManualAutoDelete(row, { clearFadeClass: !preserveFadeClass });
          const id = row.dataset.id;
          if (!id) return;
          try {
            const response = await fetch(`/groceries/items/${id}`, {
              method: "DELETE",
              headers: apiHeaders(),
            });
            if (!response.ok) {
              row.classList.remove("is-auto-removing");
              addedBoughtSection.classList.remove("is-clearing");
              return;
            }
            row.remove();
            refreshAddedBoughtVisibility();
          } catch (_error) {
            row.classList.remove("is-auto-removing");
            addedBoughtSection.classList.remove("is-clearing");
          }
        };

        const autoDeleteAfterFade = async (row) => {
          const id = row.dataset.id;
          if (!id) {
            row.classList.remove("is-auto-removing");
            addedBoughtSection.classList.remove("is-clearing");
            return;
          }

          const previousParent = row.parentElement;
          const previousNextSibling = row.nextSibling;

          row.remove();
          refreshAddedBoughtVisibility();

          try {
            const response = await fetch(`/groceries/items/${id}`, {
              method: "DELETE",
              headers: apiHeaders(),
            });
            if (response.ok) {
              return;
            }
          } catch (_error) {
          }

          // Roll back in UI if backend delete fails.
          row.classList.remove("is-auto-removing");
          if (previousParent instanceof Node) {
            previousParent.insertBefore(row, previousNextSibling);
          } else {
            addedBoughtList.appendChild(row);
          }
          refreshAddedBoughtVisibility();
        };

        const handleBoughtToggle = async (row, checkbox) => {
          const id = row.dataset.id;
          if (!id) return;
          const bought = checkbox.checked;

          if (!bought) {
            clearManualAutoDelete(row);
          }

          const previousParent = row.parentElement;
          const previousBoughtClass = row.classList.contains("is-bought");

          if (!bought) {
            clearPlanBoxAutoDelete(group);
          }

          if (bought) {
            row.classList.add("is-bought");
            addedBoughtList.appendChild(row);
            scheduleManualAutoDelete(row);
          } else {
            row.classList.remove("is-bought");
            addedList.appendChild(row);
          }
          refreshAddedBoughtVisibility();

          try {
            const response = await fetch(`/groceries/items/${id}/bought`, {
              method: "PATCH",
              headers: apiHeaders(),
              body: JSON.stringify({ bought }),
            });
            if (!response.ok) {
              checkbox.checked = !bought;
              clearManualAutoDelete(row);
              if (previousParent instanceof HTMLElement) {
                previousParent.appendChild(row);
              }
              if (previousBoughtClass) {
                row.classList.add("is-bought");
              } else {
                row.classList.remove("is-bought");
              }
              refreshAddedBoughtVisibility();
              return;
            }
          } catch (_error) {
            checkbox.checked = !bought;
            clearManualAutoDelete(row);
            if (previousParent instanceof HTMLElement) {
              previousParent.appendChild(row);
            }
            if (previousBoughtClass) {
              row.classList.add("is-bought");
            } else {
              row.classList.remove("is-bought");
            }
            refreshAddedBoughtVisibility();
          }
        };

        const handleRecipeBoughtToggle = async (row, checkbox) => {
          const id = row.dataset.id;
          if (!id) return;
          const bought = checkbox.checked;

          const group = row.closest(".groceries-recipe-group");
          if (!(group instanceof HTMLElement)) return;
          const activeList = group.querySelector("[data-recipe-group-list]");
          const boughtList = group.querySelector("[data-recipe-group-bought-list]");
          if (!(activeList instanceof HTMLUListElement) || !(boughtList instanceof HTMLUListElement)) return;

          const previousParent = row.parentElement;
          const previousBoughtClass = row.classList.contains("is-bought");

          if (!bought) {
            clearRecipeGroupAutoDelete(group);
          }

          if (bought) {
            row.classList.add("is-bought");
            boughtList.appendChild(row);
          } else {
            row.classList.remove("is-bought");
            activeList.appendChild(row);
          }
          refreshRecipeGroupBoughtVisibility(group);

          const totalItems = activeList.children.length + boughtList.children.length;
          const allChecked = totalItems > 0 && activeList.children.length === 0;
          if (allChecked) {
            scheduleRecipeGroupAutoDelete(group);
          }

          try {
            const response = await fetch(`/groceries/items/${id}/bought`, {
              method: "PATCH",
              headers: apiHeaders(),
              body: JSON.stringify({ bought }),
            });
            if (!response.ok) {
              checkbox.checked = !bought;
              clearRecipeGroupAutoDelete(group);
              if (previousParent instanceof HTMLElement) {
                previousParent.appendChild(row);
              }
              if (previousBoughtClass) {
                row.classList.add("is-bought");
              } else {
                row.classList.remove("is-bought");
              }
              refreshRecipeGroupBoughtVisibility(group);
              const totalAfterRollback = activeList.children.length + boughtList.children.length;
              const allCheckedAfterRollback = totalAfterRollback > 0 && activeList.children.length === 0;
              if (allCheckedAfterRollback) {
                scheduleRecipeGroupAutoDelete(group);
              }
            }
          } catch (_error) {
            checkbox.checked = !bought;
            clearRecipeGroupAutoDelete(group);
            if (previousParent instanceof HTMLElement) {
              previousParent.appendChild(row);
            }
            if (previousBoughtClass) {
              row.classList.add("is-bought");
            } else {
              row.classList.remove("is-bought");
            }
            refreshRecipeGroupBoughtVisibility(group);
            const totalAfterRollback = activeList.children.length + boughtList.children.length;
            const allCheckedAfterRollback = totalAfterRollback > 0 && activeList.children.length === 0;
            if (allCheckedAfterRollback) {
              scheduleRecipeGroupAutoDelete(group);
            }
          }
        };

        const handlePlanBoughtToggle = async (row, checkbox) => {
          const id = row.dataset.id;
          if (!id) return;
          const bought = checkbox.checked;

          const group = row.closest(".weekly-plan-box");
          if (!(group instanceof HTMLElement)) return;
          const activeList = group.querySelector(".weekly-plan-checklist");
          const boughtList = group.querySelector(".bought-checklist");
          if (!(activeList instanceof HTMLUListElement) || !(boughtList instanceof HTMLUListElement)) return;

          const previousParent = row.parentElement;
          const previousBoughtClass = row.classList.contains("is-bought");

          if (bought) {
            row.classList.add("is-bought");
            boughtList.appendChild(row);
          } else {
            row.classList.remove("is-bought");
            activeList.appendChild(row);
          }
          refreshPlanBoxBoughtVisibility(group);

          try {
            const response = await fetch(`/groceries/items/${id}/bought`, {
              method: "PATCH",
              headers: apiHeaders(),
              body: JSON.stringify({ bought }),
            });
            if (!response.ok) {
              checkbox.checked = !bought;
              if (previousParent instanceof HTMLElement) {
                previousParent.appendChild(row);
              }
              if (previousBoughtClass) {
                row.classList.add("is-bought");
              } else {
                row.classList.remove("is-bought");
              }
              refreshPlanBoxBoughtVisibility(group);
              return;
            }

            if (bought) {
              await removePlanBoxIfComplete(group);
            }
          } catch (_error) {
            checkbox.checked = !bought;
            if (previousParent instanceof HTMLElement) {
              previousParent.appendChild(row);
            }
            if (previousBoughtClass) {
              row.classList.add("is-bought");
            } else {
              row.classList.remove("is-bought");
            }
            refreshPlanBoxBoughtVisibility(group);
          }
        };

        const handleAddedListClick = (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;

          const removeBtn = target.closest(".groceries-added-delete");
          if (removeBtn) {
            const row = removeBtn.closest(".groceries-added-item");
            if (row instanceof HTMLLIElement) {
              handleDelete(row);
            }
          }
        };

        const handleAddedListChange = (event) => {
          const target = event.target;
          if (!(target instanceof HTMLInputElement) || target.type !== "checkbox") return;
          const row = target.closest(".groceries-added-item");
          if (!(row instanceof HTMLLIElement)) return;
          handleBoughtToggle(row, target);
        };

        const handleRecipeListChange = (event) => {
          const target = event.target;
          if (!(target instanceof HTMLInputElement) || target.type !== "checkbox") return;
          const row = target.closest("li");
          if (!(row instanceof HTMLLIElement)) return;
          handleRecipeBoughtToggle(row, target);
        };

        const handlePlanListChange = (event) => {
          const target = event.target;
          if (!(target instanceof HTMLInputElement) || target.type !== "checkbox") return;
          const row = target.closest("li");
          if (!(row instanceof HTMLLIElement)) return;
          handlePlanBoughtToggle(row, target);
        };

        const handleRecipeGroupRemove = async (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) return;
          const removeBtn = target.closest("[data-recipe-remove]");
          if (!(removeBtn instanceof HTMLButtonElement)) return;

          const group = removeBtn.closest(".groceries-recipe-group");
          if (!(group instanceof HTMLElement)) return;
          const recipeId = group.dataset.recipeId;
          if (!recipeId) return;

          clearRecipeGroupAutoDelete(group);

          removeBtn.disabled = true;

          try {
            const response = await fetch(`/groceries/items/from-recipe/${recipeId}`, {
              method: "DELETE",
              headers: apiHeaders(),
            });
            if (!response.ok) {
              removeBtn.disabled = false;
              return;
            }

            group.remove();
            if (!recipeGroups.querySelector(".groceries-recipe-group")) {
              recipeEmpty.hidden = false;
            }
          } catch (_error) {
            removeBtn.disabled = false;
          }
        };

        addedList.addEventListener("click", handleAddedListClick);
        addedBoughtList.addEventListener("click", handleAddedListClick);
        addedList.addEventListener("change", handleAddedListChange);
        addedBoughtList.addEventListener("change", handleAddedListChange);
        recipeGroups.addEventListener("click", handleRecipeGroupRemove);
        recipeGroups.addEventListener("change", handleRecipeListChange);
        weeklyPlanList.addEventListener("change", handlePlanListChange);

        document.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof Node)) return;
          if (!rowsContainer.contains(target)) {
            closeUnitMenus();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeUnitMenus();
          }
        });

        renderUserItems(Array.isArray(initialManualItems) ? initialManualItems : []);
        renderRecipeItems(Array.isArray(initialRecipeBoxes) ? initialRecipeBoxes : []);
        renderPlanBoxes(Array.isArray(initialPlanBoxes) ? initialPlanBoxes : []);
      })();
    </script>
  </body>
</html>
