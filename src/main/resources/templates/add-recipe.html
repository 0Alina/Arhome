<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle != null ? pageTitle : 'Ajouter une recette'}">Ajouter une recette</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=64)}" href="/css/style.css?v=64" />
  </head>
  <body class="page-recipes">
    <div th:replace="~{fragments :: navbar}"></div>

    <main class="page-content">
      <section class="add-recipe-page">
        <div class="add-recipe-shell">
          <div class="add-recipe-card add-recipe-card--split" data-book>
          <form id="add-recipe-form" class="add-recipe-form add-recipe-form--split" th:action="@{${formAction}}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="add-recipe-spread add-recipe-spread--one">
              <div class="add-recipe-col add-recipe-col--left">
                <div class="add-recipe-field">
                  <label for="recipe-title">Titre</label>
                  <input id="recipe-title" name="title" type="text" placeholder="Titre de la recette" th:value="${recipe.title}" required />
                </div>
                <div class="add-recipe-field">
                  <label for="recipe-photo">Photo de la recette (optionnelle)</label>
                  <div class="file-field">
                    <input id="recipe-photo" type="file" accept="image/*" />
                    <button class="file-button" type="button" data-file-trigger
                            th:text="${isEdit == true ? 'Changer le fichier' : 'Choisir un fichier'}">Choisir un fichier</button>
                    <span class="file-name" data-file-name
                          th:text="${isEdit == true ? 'Image actuelle définie' : 'Aucune image sélectionnée'}">Aucune image sélectionnée</span>
                  </div>
                  <input type="hidden" name="imagePath" th:value="${recipe.imagePath}" data-image-path />
                </div>
                <div class="add-recipe-field">
                  <label for="recipe-desc">Description courte</label>
                  <textarea id="recipe-desc" name="shortDescription" rows="2" placeholder="Description courte" th:text="${recipe.shortDescription}"></textarea>
                </div>
                <div class="add-recipe-grid">
                  <div class="add-recipe-field">
                    <label for="recipe-time">Temps de préparation</label>
                    <input id="recipe-time" name="prepTime" type="text" placeholder="ex. 35 min" th:value="${recipe.prepTime}" required />
                  </div>
                  <div class="add-recipe-field">
                    <label for="recipe-meal">Type de repas</label>
                    <div class="ingredient-unit-select meal-type-select" data-meal-select>
                      <input id="recipe-meal" type="hidden" name="mealType" th:value="${recipe.mealType}" data-meal-value />
                      <button type="button"
                              class="ingredient-unit-trigger meal-type-trigger"
                              data-meal-trigger
                              aria-expanded="false"
                              th:text="${recipe.mealType != null && !#strings.isEmpty(recipe.mealType) ? recipe.mealType : 'Sélectionner'}">Sélectionner</button>
                      <div class="ingredient-unit-menu meal-type-menu" data-meal-menu>
                        <button type="button" class="ingredient-unit-option" data-meal-option data-value="Breakfast">Breakfast</button>
                        <button type="button" class="ingredient-unit-option" data-meal-option data-value="Lunch">Lunch</button>
                        <button type="button" class="ingredient-unit-option" data-meal-option data-value="Dinner">Dinner</button>
                        <button type="button" class="ingredient-unit-option" data-meal-option data-value="Dessert">Dessert</button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="add-recipe-tags">
                  <div class="add-recipe-tag-group">
                    <span>Région</span>
                    <label><input type="checkbox" name="regionTags" value="American" th:checked="${recipe.regionTags != null && recipe.regionTags.contains('American')}" /> American</label>
                    <label><input type="checkbox" name="regionTags" value="Asian" th:checked="${recipe.regionTags != null && recipe.regionTags.contains('Asian')}" /> Asian</label>
                    <label><input type="checkbox" name="regionTags" value="European" th:checked="${recipe.regionTags != null && recipe.regionTags.contains('European')}" /> European</label>
                    <label><input type="checkbox" name="regionTags" value="Mexican" th:checked="${recipe.regionTags != null && recipe.regionTags.contains('Mexican')}" /> Mexican</label>
                  </div>
                  <div class="add-recipe-tag-group">
                    <span>Style</span>
                    <label><input type="checkbox" name="styleTags" value="No cook" th:checked="${recipe.styleTags != null && recipe.styleTags.contains('No cook')}" /> No cook</label>
                    <label><input type="checkbox" name="styleTags" value="One pot" th:checked="${recipe.styleTags != null && recipe.styleTags.contains('One pot')}" /> One pot</label>
                    <label><input type="checkbox" name="styleTags" value="Budget" th:checked="${recipe.styleTags != null && recipe.styleTags.contains('Budget')}" /> Budget</label>
                  </div>
                  <div class="add-recipe-tag-group">
                    <span>Nutrition</span>
                    <label><input type="checkbox" name="nutritionTags" value="Vegetarian" th:checked="${recipe.nutritionTags != null && recipe.nutritionTags.contains('Vegetarian')}" /> Végétarien</label>
                    <label><input type="checkbox" name="nutritionTags" value="Gluten-free" th:checked="${recipe.nutritionTags != null && recipe.nutritionTags.contains('Gluten-free')}" /> Sans gluten</label>
                    <label><input type="checkbox" name="nutritionTags" value="Protein+" th:checked="${recipe.nutritionTags != null && recipe.nutritionTags.contains('Protein+')}" /> Protéines+</label>
                    <label><input type="checkbox" name="nutritionTags" value="Fibre+" th:checked="${recipe.nutritionTags != null && recipe.nutritionTags.contains('Fibre+')}" /> Fibres+</label>
                  </div>
                </div>
              </div>
              <div class="add-recipe-divider" aria-hidden="true"></div>
              <div class="add-recipe-col add-recipe-col--right">
                <div class="add-recipe-field add-recipe-field--fill">
                  <label>Ingredients</label>
                  <div class="add-recipe-ingredients" data-ingredient-rows>
                    <div class="add-recipe-ingredient-row" th:each="item, stat : ${recipe.ingredientItems}">
                      <input type="text"
                             th:name="|ingredientItems[${stat.index}].name|"
                             th:value="${item.name}"
                         list="ingredient-suggestions"
                             placeholder="Ingredient"
                             required />
                      <input type="number"
                         inputmode="decimal"
                           min="0"
                           step="0.5"
                             th:name="|ingredientItems[${stat.index}].quantity|"
                             th:value="${item.quantity}"
                             placeholder="Quantité"
                             required />
                      <div class="ingredient-unit-select" data-unit-select>
                        <input type="hidden"
                               data-unit-value
                               th:name="|ingredientItems[${stat.index}].unit|"
                               th:value="${item.unit}" />
                        <button type="button"
                                class="ingredient-unit-trigger"
                                data-unit-trigger
                          aria-expanded="false"
                                th:text="${item.unit != null && !#strings.isEmpty(item.unit) ? item.unit : 'Unité'}">Unité</button>
                        <div class="ingredient-unit-menu" data-unit-menu>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="pcs">pcs</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="slice">slice</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="pinch">pinch</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="tsp">tsp</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="tbsp">tbsp</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="cup">cup</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="l">l</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="ml">ml</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="mg">mg</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="g">g</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="kg">kg</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="oz">oz</button>
                          <button type="button" class="ingredient-unit-option" data-unit-option data-value="lb">lb</button>
                        </div>
                      </div>
                      <button class="btn-secondary" type="button" data-ingredient-action
                              th:text="${stat.last ? 'Ajouter' : 'Retirer'}">Ajouter</button>
                    </div>
                  </div>
                  <datalist id="ingredient-suggestions"></datalist>
                </div>
              </div>
            </div>

            <div class="add-recipe-spread add-recipe-spread--two">
              <div class="add-recipe-col add-recipe-col--left">
                <div class="add-recipe-field add-recipe-field--fill">
                  <label for="recipe-steps">Étapes</label>
                  <textarea id="recipe-steps" name="steps" rows="12" placeholder="Écrivez les étapes" data-list="number" th:text="${recipe.steps}"></textarea>
                </div>
              </div>
              <div class="add-recipe-divider" aria-hidden="true"></div>
              <div class="add-recipe-col add-recipe-col--right">
                <div class="add-recipe-field add-recipe-field--fill">
                  <label for="recipe-notes">Instructions</label>
                  <textarea id="recipe-notes" name="instructions" rows="12" placeholder="Écrivez les instructions" th:text="${recipe.instructions}"></textarea>
                </div>
              </div>
            </div>
          </form>
          <div class="add-recipe-book-nav">
            <button class="add-recipe-arrow add-recipe-arrow--left" type="button" data-prev-page aria-label="Précédent">
              <span class="add-recipe-arrow__icon" aria-hidden="true"></span>
            </button>
            <button class="add-recipe-arrow add-recipe-arrow--right" type="button" data-next-page aria-label="Suivant">
              <span class="add-recipe-arrow__icon" aria-hidden="true"></span>
            </button>
          </div>
          </div>
          <div class="add-recipe-actions">
            <a class="btn-secondary add-recipe-cancel" href="/profile">Annuler</a>
            <button class="btn-primary add-recipe-submit" type="submit" form="add-recipe-form">Enregistrer la recette</button>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
    <script th:inline="javascript">
      (() => {
        const book = document.querySelector("[data-book]");
        if (!book) return;
        const nextBtn = book.querySelector("[data-next-page]");
        const prevBtn = book.querySelector("[data-prev-page]");

        book.querySelectorAll("[data-next-page]").forEach((btn) => {
          btn.addEventListener("click", () => book.classList.add("is-page-two"));
        });
        book.querySelectorAll("[data-prev-page]").forEach((btn) => {
          btn.addEventListener("click", () => book.classList.remove("is-page-two"));
        });

        const form = document.getElementById("add-recipe-form");
        const ingredientSuggestionsList = document.getElementById("ingredient-suggestions");
        const ingredientSuggestionCache = new Map();
        let ingredientSuggestTimer = null;
        let ingredientSuggestAbortController = null;
        const fileInput = document.getElementById("recipe-photo");
        const fileTrigger = document.querySelector("[data-file-trigger]");
        const fileName = document.querySelector("[data-file-name]");
        const imagePathInput = document.querySelector("[data-image-path]");
        const submitBtn = document.querySelector(".add-recipe-submit");
        const csrfToken = form ? form.querySelector("input[name='_csrf']")?.value : null;
        if (fileInput && fileTrigger && fileName) {
          fileTrigger.addEventListener("click", () => fileInput.click());
          const defaultName = fileName.textContent;
          fileInput.addEventListener("change", () => {
            if (!fileInput.files || fileInput.files.length === 0) {
              fileName.textContent = defaultName;
              return;
            }

            fileName.textContent = "Téléversement...";
            if (submitBtn) submitBtn.disabled = true;

            const formData = new FormData();
            formData.append("photo", fileInput.files[0]);

            fetch("/recipes/upload-image", {
              method: "POST",
              body: formData,
              headers: csrfToken ? { "X-CSRF-TOKEN": csrfToken } : {},
            })
              .then((res) => res.json())
              .then((data) => {
                if (data && data.ok && data.url) {
                  if (imagePathInput) imagePathInput.value = data.url;
                  fileName.textContent = fileInput.files[0].name;
                } else {
                  fileName.textContent = "Échec du téléversement";
                }
              })
              .catch(() => {
                fileName.textContent = "Échec du téléversement";
              })
              .finally(() => {
                if (submitBtn) submitBtn.disabled = false;
              });
          });
        }

        if (form && fileInput) {
          form.addEventListener("submit", (event) => {
            if (fileInput.files && fileInput.files.length > 0 && !imagePathInput.value) {
              event.preventDefault();
              fileName.textContent = "Téléversement non terminé";
            }
          });
        }

        if (form && fileInput) {
          form.addEventListener("submit", () => {
            if (!fileInput.files || fileInput.files.length === 0) {
              fileInput.disabled = true;
              form.removeAttribute("enctype");
            }
          });
        }

        const ingredientRows = document.querySelector("[data-ingredient-rows]");
        const mealSelectRoot = document.querySelector("[data-meal-select]");
        const mealValueInput = document.querySelector("[data-meal-value]");
        const mealTrigger = document.querySelector("[data-meal-trigger]");
        const mealOptions = document.querySelectorAll("[data-meal-option]");

        const syncMealState = () => {
          if (!(mealValueInput instanceof HTMLInputElement) || !(mealTrigger instanceof HTMLButtonElement)) return;
          const value = mealValueInput.value ? mealValueInput.value.trim() : "";
          mealTrigger.textContent = value || "Select one";
          mealTrigger.classList.toggle("is-empty", value.length === 0);

          mealOptions.forEach((optionButton) => {
            if (!(optionButton instanceof HTMLButtonElement)) return;
            optionButton.classList.toggle("is-selected", optionButton.dataset.value === value);
          });
        };

        const closeMealMenu = () => {
          if (!(mealSelectRoot instanceof HTMLElement)) return;
          mealSelectRoot.classList.remove("is-open");
          if (mealTrigger instanceof HTMLButtonElement) {
            mealTrigger.setAttribute("aria-expanded", "false");
          }
        };

        if (mealSelectRoot instanceof HTMLElement && mealValueInput instanceof HTMLInputElement && mealTrigger instanceof HTMLButtonElement) {
          syncMealState();

          mealTrigger.addEventListener("click", () => {
            const willOpen = !mealSelectRoot.classList.contains("is-open");
            closeUnitMenus();
            mealSelectRoot.classList.toggle("is-open", willOpen);
            mealTrigger.setAttribute("aria-expanded", willOpen ? "true" : "false");
          });

          mealOptions.forEach((optionButton) => {
            optionButton.addEventListener("click", () => {
              mealValueInput.value = optionButton.dataset.value || "";
              syncMealState();
              closeMealMenu();
            });
          });

          document.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof Node)) return;
            if (!mealSelectRoot.contains(target)) {
              closeMealMenu();
            }
          });

          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              closeMealMenu();
            }
          });
        }

        const renderIngredientSuggestions = (suggestions) => {
          if (!ingredientSuggestionsList) return;
          ingredientSuggestionsList.innerHTML = "";
          suggestions.forEach((suggestion) => {
            const option = document.createElement("option");
            option.value = suggestion;
            ingredientSuggestionsList.appendChild(option);
          });
        };

        const requestIngredientSuggestions = (query) => {
          if (!ingredientSuggestionsList) return;
          const normalized = (query || "").trim().toLowerCase();

          if (normalized.length < 2) {
            renderIngredientSuggestions([]);
            return;
          }

          if (ingredientSuggestionCache.has(normalized)) {
            renderIngredientSuggestions(ingredientSuggestionCache.get(normalized) || []);
            return;
          }

          if (ingredientSuggestAbortController) {
            ingredientSuggestAbortController.abort();
          }

          ingredientSuggestAbortController = new AbortController();
          fetch(`/recipes/ingredients/suggestions?q=${encodeURIComponent(normalized)}`, {
            signal: ingredientSuggestAbortController.signal,
          })
            .then((res) => (res.ok ? res.json() : []))
            .then((data) => {
              const suggestions = Array.isArray(data) ? data.filter((value) => typeof value === "string") : [];
              ingredientSuggestionCache.set(normalized, suggestions);
              renderIngredientSuggestions(suggestions);
            })
            .catch((error) => {
              if (error && error.name === "AbortError") {
                return;
              }
              renderIngredientSuggestions([]);
            });
        };
        const reindexIngredientRows = () => {
          if (!ingredientRows) return;
          const rows = ingredientRows.querySelectorAll(".add-recipe-ingredient-row");
          rows.forEach((row, index) => {
            const nameInput = row.querySelector("input[placeholder='Ingredient']");
            const quantityInput = row.querySelector("input[placeholder='Qty']");
            const unitInput = row.querySelector("input[data-unit-value]");
            if (nameInput) nameInput.name = `ingredientItems[${index}].name`;
            if (quantityInput) quantityInput.name = `ingredientItems[${index}].quantity`;
            if (unitInput) unitInput.name = `ingredientItems[${index}].unit`;
          });
        };

        const syncCustomUnitState = (row) => {
          const unitValueInput = row.querySelector("input[data-unit-value]");
          const unitTrigger = row.querySelector("[data-unit-trigger]");
          if (!unitValueInput || !unitTrigger) return;

          const value = unitValueInput.value ? unitValueInput.value.trim() : "";
          unitTrigger.textContent = value || "Unit";
          unitTrigger.classList.toggle("is-empty", value.length === 0);

          row.querySelectorAll("[data-unit-option]").forEach((optionButton) => {
            if (!(optionButton instanceof HTMLButtonElement)) return;
            optionButton.classList.toggle("is-selected", optionButton.dataset.value === value);
          });
        };

        const closeUnitMenus = (except) => {
          if (!ingredientRows) return;
          ingredientRows.querySelectorAll("[data-unit-select].is-open").forEach((selectRoot) => {
            if (except && selectRoot === except) return;
            selectRoot.classList.remove("is-open");
            const trigger = selectRoot.querySelector("[data-unit-trigger]");
            if (trigger instanceof HTMLButtonElement) {
              trigger.setAttribute("aria-expanded", "false");
            }
          });
        };

        const getIngredientRowState = (row) => {
          const nameInput = row.querySelector("input[placeholder='Ingredient']");
          const quantityInput = row.querySelector("input[placeholder='Qty']");
          const unitInput = row.querySelector("input[data-unit-value]");

          const nameValue = nameInput instanceof HTMLInputElement ? nameInput.value.trim() : "";
          const quantityValue = quantityInput instanceof HTMLInputElement ? quantityInput.value.trim() : "";
          const unitValue = unitInput instanceof HTMLInputElement ? unitInput.value.trim() : "";

          const hasAny = nameValue.length > 0 || quantityValue.length > 0 || unitValue.length > 0;
          const hasAll = nameValue.length > 0 && quantityValue.length > 0 && unitValue.length > 0;

          return {
            nameInput,
            quantityInput,
            unitInput,
            hasAny,
            hasAll,
            missingName: nameValue.length === 0,
            missingQuantity: quantityValue.length === 0,
            missingUnit: unitValue.length === 0,
          };
        };

        const syncIngredientRowRequirements = () => {
          if (!ingredientRows) return;
          ingredientRows.querySelectorAll(".add-recipe-ingredient-row").forEach((row) => {
            const state = getIngredientRowState(row);
            if (state.nameInput instanceof HTMLInputElement) {
              state.nameInput.required = state.hasAny;
            }
            if (state.quantityInput instanceof HTMLInputElement) {
              state.quantityInput.required = state.hasAny;
            }
          });
        };

        const syncIngredientActionButtons = () => {
          if (!ingredientRows) return;
          const rows = Array.from(ingredientRows.querySelectorAll(".add-recipe-ingredient-row"));
          rows.forEach((row, index) => {
            const actionButton = row.querySelector("[data-ingredient-action]");
            if (!actionButton) return;
            const isLast = index === rows.length - 1;
            actionButton.textContent = isLast ? "Add" : "Remove";
            actionButton.setAttribute("data-action", isLast ? "add" : "remove");
          });
        };

        const createIngredientRow = () => {
          const row = document.createElement("div");
          row.className = "add-recipe-ingredient-row";
          row.innerHTML = `
            <input type="text" placeholder="Ingredient" required />
            <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="Qty" required />
            <div class="ingredient-unit-select" data-unit-select>
              <input type="hidden" data-unit-value value="" />
              <button type="button" class="ingredient-unit-trigger is-empty" data-unit-trigger aria-expanded="false">Unit</button>
              <div class="ingredient-unit-menu" data-unit-menu>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="pcs">pcs</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="pinch">pinch</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="tsp">tsp</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="tbsp">tbsp</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="cup">cup</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="l">l</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="ml">ml</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="mg">mg</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="g">g</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="kg">kg</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="oz">oz</button>
                <button type="button" class="ingredient-unit-option" data-unit-option data-value="lb">lb</button>
              </div>
            </div>
            <button class="btn-secondary" type="button" data-ingredient-action data-action="add">Add</button>
          `;
          const ingredientInput = row.querySelector("input[placeholder='Ingredient']");
          if (ingredientInput && ingredientSuggestionsList) {
            ingredientInput.setAttribute("list", "ingredient-suggestions");
          }
          return row;
        };

        if (ingredientRows) {
          const qtyArrowZoneWidth = 18;
          const unitArrowZoneWidth = 20;

          ingredientRows.addEventListener("pointermove", (event) => {
            const target = event.target;
            if (target instanceof HTMLInputElement) {
              if (target.type !== "number" || target.placeholder !== "Qty") return;

              const rect = target.getBoundingClientRect();
              const onArrowZone = event.clientX >= rect.right - qtyArrowZoneWidth;
              target.style.cursor = onArrowZone ? "pointer" : "text";
              return;
            }

            if (!(target instanceof HTMLButtonElement) || !target.matches("[data-unit-trigger]")) return;
            const rect = target.getBoundingClientRect();
            const onArrowZone = event.clientX >= rect.right - unitArrowZoneWidth;
            target.style.cursor = onArrowZone ? "pointer" : "default";
          });

          ingredientRows.addEventListener("pointerleave", (event) => {
            const target = event.target;
            if (target instanceof HTMLInputElement) {
              if (target.type !== "number" || target.placeholder !== "Qty") return;
              target.style.cursor = "text";
              return;
            }

            if (!(target instanceof HTMLButtonElement) || !target.matches("[data-unit-trigger]")) return;
            target.style.cursor = "default";
          }, true);

          ingredientRows.addEventListener("pointerdown", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement)) return;
            if (target.type !== "number" || target.placeholder !== "Qty") return;

            const rect = target.getBoundingClientRect();
            const clickedArrowZone = event.clientX >= rect.right - qtyArrowZoneWidth;
            if (!clickedArrowZone) return;

            event.preventDefault();

            const clickedUpperHalf = event.clientY < rect.top + rect.height / 2;
            if (clickedUpperHalf) {
              target.stepUp();
            } else {
              target.stepDown();
              if (!Number.isNaN(target.valueAsNumber) && target.valueAsNumber < 0) {
                target.value = "0";
              }
            }

            target.dispatchEvent(new Event("input", { bubbles: true }));
            target.dispatchEvent(new Event("change", { bubbles: true }));
          });

          ingredientRows.addEventListener("input", (event) => {
            const target = event.target;
            if (target instanceof HTMLInputElement && target.placeholder === "Ingredient") {
              if (ingredientSuggestTimer) {
                clearTimeout(ingredientSuggestTimer);
              }
              ingredientSuggestTimer = window.setTimeout(() => {
                requestIngredientSuggestions(target.value);
              }, 180);
            }

            if (!(target instanceof HTMLInputElement)) return;
            if (target.type !== "number" || target.placeholder !== "Qty") return;
            if (target.value === "") return;

            const value = Number.parseFloat(target.value);
            if (!Number.isNaN(value) && value < 0) {
              target.value = "0";
            }
          });

          ingredientRows.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;

            const unitOption = target.closest("[data-unit-option]");
            if (unitOption instanceof HTMLButtonElement) {
              const row = unitOption.closest(".add-recipe-ingredient-row");
              if (!row) return;
              const unitValueInput = row.querySelector("input[data-unit-value]");
              if (unitValueInput) {
                unitValueInput.value = unitOption.dataset.value || "";
              }
              syncCustomUnitState(row);
              closeUnitMenus();
              return;
            }

            const unitTrigger = target.closest("[data-unit-trigger]");
            if (unitTrigger instanceof HTMLButtonElement) {
              const selectRoot = unitTrigger.closest("[data-unit-select]");
              if (!selectRoot) return;
              const willOpen = !selectRoot.classList.contains("is-open");
              closeUnitMenus(selectRoot);
              selectRoot.classList.toggle("is-open", willOpen);
              unitTrigger.setAttribute("aria-expanded", willOpen ? "true" : "false");
              return;
            }

            if (!target.matches("[data-ingredient-action]")) return;

            const row = target.closest(".add-recipe-ingredient-row");
            if (!row) return;
            const action = target.getAttribute("data-action");

            if (action === "add") {
              ingredientRows.appendChild(createIngredientRow());
              reindexIngredientRows();
              syncIngredientActionButtons();
              syncIngredientRowRequirements();
              return;
            }

            const rows = ingredientRows.querySelectorAll(".add-recipe-ingredient-row");

            if (rows.length <= 1) {
              row.querySelectorAll("input").forEach((input) => {
                input.value = "";
              });
              const unitInput = row.querySelector("input[data-unit-value]");
              if (unitInput) {
                unitInput.value = "";
              }
              syncCustomUnitState(row);
              syncIngredientActionButtons();
              syncIngredientRowRequirements();
              return;
            }

            row.remove();
            reindexIngredientRows();
            syncIngredientActionButtons();
            syncIngredientRowRequirements();
          });

          document.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof Node)) return;
            if (!ingredientRows.contains(target)) {
              closeUnitMenus();
            }
          });
        }

        if (form && ingredientRows) {
          form.addEventListener("submit", (event) => {
            if (mealValueInput instanceof HTMLInputElement && mealValueInput.value.trim().length === 0) {
              event.preventDefault();
              if (mealTrigger instanceof HTMLButtonElement) {
                mealTrigger.focus();
                if (mealSelectRoot instanceof HTMLElement) {
                  mealSelectRoot.classList.add("is-open");
                  mealTrigger.setAttribute("aria-expanded", "true");
                }
              }
              return;
            }

            syncIngredientRowRequirements();

            const rows = Array.from(ingredientRows.querySelectorAll(".add-recipe-ingredient-row"));
            const rowStates = rows.map((row) => ({ row, state: getIngredientRowState(row) }));
            const completeRowsCount = rowStates.filter(({ state }) => state.hasAll).length;
            const invalidRow = rowStates.find(({ state }) => state.hasAny && !state.hasAll);

            if (invalidRow) {
              event.preventDefault();
              const { row, state } = invalidRow;

              if (state.missingName && state.nameInput instanceof HTMLInputElement) {
                state.nameInput.focus();
                return;
              }

              if (state.missingQuantity && state.quantityInput instanceof HTMLInputElement) {
                state.quantityInput.focus();
                return;
              }

              const trigger = row.querySelector("[data-unit-trigger]");
              if (trigger instanceof HTMLButtonElement) {
                trigger.focus();
                const selectRoot = trigger.closest("[data-unit-select]");
                if (selectRoot) {
                  closeUnitMenus(selectRoot);
                  selectRoot.classList.add("is-open");
                  trigger.setAttribute("aria-expanded", "true");
                }
              }
              return;
            }

            if (completeRowsCount === 0) {
              event.preventDefault();
              const firstRow = rows[0];
              const firstNameInput = firstRow ? firstRow.querySelector("input[placeholder='Ingredient']") : null;
              if (firstNameInput instanceof HTMLInputElement) {
                firstNameInput.focus();
              }
              return;
            }
          });
        }

        reindexIngredientRows();
        syncIngredientActionButtons();
        if (ingredientRows) {
          ingredientRows.querySelectorAll(".add-recipe-ingredient-row").forEach(syncCustomUnitState);
          syncIngredientRowRequirements();
        }

          const applyListBehavior = (textarea) => {
            const mode = textarea.getAttribute("data-list");
            if (!mode) return;

          const prefixForIndex = (index) => (mode === "number" ? `${index}. ` : "- ");

          const lastNumberedIndex = (value) => {
            let last = 0;
            value.split("\n").forEach((line) => {
              const match = line.trim().match(/^(\d+)\.\s+/);
              if (match) last = Math.max(last, parseInt(match[1], 10));
            });
            return last;
          };

          const normalizeStart = () => {
            if (textarea.value.trim().length === 0) {
              textarea.value = prefixForIndex(1);
            }
          };

          textarea.addEventListener("focus", () => {
            if (textarea.value.trim().length === 0) {
              normalizeStart();
            }
          });

          textarea.addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            if (event.shiftKey) {
              return;
            }
            event.preventDefault();
            const value = textarea.value;
            const selectionStart = textarea.selectionStart;
            const selectionEnd = textarea.selectionEnd;
            const before = value.slice(0, selectionStart);
            const after = value.slice(selectionEnd);
            const nextIndex = mode === "number" ? lastNumberedIndex(before) + 1 : 1;
            const insert = "\n" + prefixForIndex(nextIndex);
            textarea.value = before + insert + after;
            const newPos = before.length + insert.length;
            textarea.selectionStart = newPos;
            textarea.selectionEnd = newPos;
          });

          if (mode === "dash") {
            const normalizeLines = () => {
              const lines = textarea.value.split("\n");
              const normalized = lines.map((line) => {
                const trimmed = line.trim();
                if (trimmed.length === 0) return "";
                if (trimmed === "-") return "";
                if (trimmed.startsWith("- ")) return trimmed;
                return "- " + trimmed.replace(/^-+\\s*/, "");
              });
              textarea.value = normalized.join("\n");
            };

            textarea.addEventListener("keydown", (event) => {
              if (event.key !== "Backspace") return;
              if (textarea.selectionStart !== textarea.selectionEnd) return;

              const value = textarea.value;
              const pos = textarea.selectionStart;
              const lineStart = value.lastIndexOf("\n", pos - 1) + 1;
              const lineEnd = value.indexOf("\n", pos);
              const end = lineEnd === -1 ? value.length : lineEnd;
              const line = value.slice(lineStart, end);
              const cursorInLine = pos - lineStart;

              if (line.trim() === "-" && cursorInLine >= line.length) {
                event.preventDefault();
                const before = value.slice(0, lineStart);
                const after = value.slice(end);
                const newBefore = lineStart > 0 ? before.slice(0, -1) : before;
                const newPos = newBefore.length;
                textarea.value = newBefore + after;
                textarea.selectionStart = newPos;
                textarea.selectionEnd = newPos;
                return;
              }

              if (line.startsWith("- ") && cursorInLine <= 2) {
                event.preventDefault();
                const newLine = line.slice(2);
                textarea.value = value.slice(0, lineStart) + newLine + value.slice(end);
                textarea.selectionStart = lineStart;
                textarea.selectionEnd = lineStart;
              }
            });

            textarea.addEventListener("paste", () => {
              setTimeout(normalizeLines, 0);
            });

            textarea.addEventListener("blur", () => {
              normalizeLines();
            });
          }
        };

        document.querySelectorAll("textarea[data-list]").forEach(applyListBehavior);
      })();
    </script>
  </body>
</html>
